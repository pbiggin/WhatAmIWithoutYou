<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/styles.css" />
    <title>What am I without You</title>
    <link rel="icon" type="image/x-icon" href="assets/ICON-HAPPY.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="content" id="eventSpace">
      <card id="drag" class="tab">
        <header id="dragheader">minimize</header>
        <p class="spoken center">What am I without you?</p>
        <button
          id="startButton"
          onclick="
            runNextEvent();
            this.remove();
          "
          class="center start-btn"
        >
          Start
        </button>
      </card>
    </main>
    <aside class="skips">
      <button
        class="skip"
        id="debugSkipButton1"
        onclick="
          skipToEvent(2);
          document.getElementById('startButton').remove();
        "
      >
        <img src="assets/ICON-EVENT1.png" title="Skip to Event 1" />
      </button>

      <button
        class="skip"
        id="debugSkipButton2"
        onclick="
          skipToEvent(3);
          document.getElementById('startButton').remove();
        "
      >
        <img src="assets/ICON-EVENT2.png" title="Skip to Event 2" />
      </button>

      <!-- hidden due to incomplete
         <button
         class="skip"
        id="debugSkipButton1"
        onclick="
          skipToEvent(4);
          this.remove();
          document.getElementById('startButton').remove();
        "
      >
      <img src="/assets/ICON-EVENT3.png" title="Skip to Event 3">
      </button>
  -->
      <button
        class="skip"
        id="debugSkipButton1"
        onclick="
          skipToEvent(4);
          document.getElementById('startButton').remove();
        "
      >
        <img src="assets/ICON-EVENT3.png" title="Skip to Event 3" />
      </button>

      <button
        class="skip"
        id="debugSkipButton1"
        onclick="
          skipToEvent(5);
          document.getElementById('startButton').remove();
        "
      >
        <img src="assets/ICON-CONCLUSION.png" title="Skip to Conclusion" />
      </button>
    </aside>
    <footer class="bar">
      <button url="https://github.com/pbiggin/WhatAmIWithoutYou">
        Github.com/PBIGGIN
      </button>
      <button class="notify-btn" onclick="notifyMe()">Grant Permissions</button>
      <p style="margin: 1vw">0:00AM</p>
    </footer>

    <script src="assets/scripts.js"></script>
  </body>
</html>
